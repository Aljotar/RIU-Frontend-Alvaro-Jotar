<mat-toolbar color="primary">
  <span>Súper héroes</span>
  <span class="spacer"></span>
  <a mat-flat-button routerLink="/heroes/new">
    <mat-icon>add</mat-icon>
    Añadir
  </a>
</mat-toolbar>
<div class="filter-bar">
  <mat-form-field appearance="outline">
    <mat-label>Filtrar por nombre</mat-label>
    <input matInput [value]="searchTerm()" (input)="onSearch($any($event.target).value)" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
</div>
<div class="grid">
  @for (hero of paginatedHeroes(); track hero.id; let i = $index) {
  <mat-card>
    <img 
    mat-card-image 
    [ngSrc]="hero.image" 
    [alt]="hero.name"
    width="400"
    height="350"
    priority
    />
    <img 
    class="universe-logo" 
    [ngSrc]="universeLogo(hero.universe)"
    [alt]="hero.universe" 
    width="80"
    height="28"
    />
    <mat-card-title class="hero-name">{{ hero.name }}</mat-card-title>
    <mat-card-actions>
      <a mat-icon-button [routerLink]="['/heroes', hero.id]" aria-label="Ver héroe" title="Ver">
        <mat-icon>visibility</mat-icon>
      </a>

      <a mat-icon-button [routerLink]="['/heroes', hero.id, 'edit']" aria-label="Editar héroe" title="Editar">
        <mat-icon>edit</mat-icon>
      </a>
      <button mat-icon-button color="warn" type="button" aria-label="Borrar héroe" title="Borrar"
        (click)="onDelete(hero.id, hero.name)">
        <mat-icon>delete</mat-icon>
      </button>
    </mat-card-actions>
  </mat-card>
  } @empty {
  <p>No hay héroes para mostrar.</p>
  }
</div>

<mat-paginator
  [length]="filteredHeroes().length"
  [pageSize]="pageSize()"
  [pageIndex]="currentPage() - 1"
  [pageSizeOptions]="[5, 10, 25]"
  [showFirstLastButtons]="true"
  (page)="onPage($event)"
/>
